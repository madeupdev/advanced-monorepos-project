name: Section 10 private recovery rehearsals
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearse:
    if: github.repository == 'madeupdev/advanced-monorepos-project' && github.ref == 'refs/heads/codex/section-10-project'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        round: [transition, section-one, section-two]
    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: course
          POSTGRES_PASSWORD: course
          POSTGRES_DB: rehearsal
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U course -d rehearsal" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - uses: actions/checkout@v7
        with:
          repository: madeupdev/madeup-video-course-cli
          ref: 2dcd4dc53b9f40923f604f521fbf05453e83c376
          path: instructor-cli
          persist-credentials: false
      - name: Install unchanged instructor builder
        working-directory: instructor-cli
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm build
      - run: corepack pnpm install --frozen-lockfile
      - name: Rehearse fresh source transitions and cold full checks
        run: node tools/course-recovery/rehearse-section10.mjs instructor-cli ${{ matrix.round }}
      - name: Retain evidence only; draft archives are never uploaded
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: section10-rehearsal-${{ matrix.round }}-${{ github.run_id }}
          path: section10-rehearsal-evidence/
          retention-days: 5
