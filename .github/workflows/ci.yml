name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate inherited application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/madeup_video?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/madeup_video_test?schema=public

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: madeup_video
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=madeup_video"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test database
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          createdb --username=postgres madeup_video_test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm exec nx lint @madeup-video/storefront

      - name: Type-check
        run: pnpm exec nx typecheck @madeup-video/storefront

      - name: Local environment tooling tests
        run: pnpm exec nx test:tooling @madeup-video/storefront

      - name: Unit tests
        run: pnpm exec nx test:unit @madeup-video/storefront

      - name: Integration tests
        run: pnpm exec nx test:integration @madeup-video/storefront

      - name: Production build
        run: pnpm exec nx build @madeup-video/storefront

      - name: End-to-end tests
        run: pnpm exec nx test:e2e @madeup-video/storefront

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 5
